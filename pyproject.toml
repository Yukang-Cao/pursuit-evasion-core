[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pursuit-evasion-core"
version = "0.1.0"
description = "Inspectable vehicle pursuit-evasion models, local game solvers, and controllers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
jax = ["hj-reachability>=0.7", "psutil>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pursuit_evasion = ["dp/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

